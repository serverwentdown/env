# See the full configuration reference: https://rioterm.com/docs/config

theme = "solarized-dark"
line-height = 1.2
padding = [0, 4, 4, 4]
use-fork = false
hide-mouse-cursor-when-typing = true
enable-scroll-bar = true
scrollback-history-limit = 50000

[scroll]
multiplier = 1.12
divider = 1.0

[hints]
alphabet = "aoeuidhtnspygcrlqjkxbmwvz"

[adaptive-theme]
light = "solarized-light"
dark = "solarized-dark"

[editor]
program = "nvim"
args = []

[window]
width = 800
height = 600
#opacity = 0.875
decorations = "Buttonless"

#[renderer]
#backend = "Webgpu"
#filters = ["NewPixieCrt"]

[navigation]
mode = "Plain"

[fonts]
family = "Fira Code"
size = 14
use-drawable-chars = true
